<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dozenten-Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700&amp;family=Red+Hat+Text:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
/* VOICE: ruhiges Arbeitswerkzeug, Zahlen zuerst
   IDEA: Stundenzettel + Rechnungsblock eines Dozenten
   PICTURE: Monatsbalken der Unterrichtsstunden im Kopfband, darunter das Erfassungsformular
   COLOUR and TYPE: Grüntöne der Rechnung (#146155, #1f8a78, #cfe3df), Gelb für Offenes; Red Hat Display/Text
   LAYOUT: Kennzahlen + Balken oben, Tabs, eine Spalte Arbeitsfläche */
:root{color-scheme:light dark;--bg:light-dark(#f4f8f7,#0b1715);--panel:light-dark(#ffffff,#12221f);--ink:light-dark(#1c2430,#e6efed);--mute:light-dark(#5d6b78,#9db3ae);--line:light-dark(#d9e6e3,#21403a);--band:light-dark(#146155,#0f4a40);--acc:#1f8a78;--ok:light-dark(#146155,#6fcfba);--soft:light-dark(#cfe3df,#1a3732)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Red Hat Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Red Hat Display",system-ui,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(30px,5vw,44px)}h2{font-size:22px;margin-bottom:14px}h3{font-size:17px}
.band{padding:clamp(24px,4vw,48px) max(5vw,16px);background:var(--band);color:#fff}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.top p{margin:6px 0 0;color:#cfe3df}
#logout{font:inherit;font-size:13px;color:#fff;border:1px solid rgba(255,255,255,.45);cursor:pointer;min-height:32px;padding:5px 14px}
#logout:hover{background:rgba(255,255,255,.25)}
.pill{font-size:13px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.12);color:#dfe5f5;white-space:nowrap}
.head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;margin-top:26px;align-items:end}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:rgba(255,255,255,.07);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font:700 clamp(24px,3.4vw,32px)/1.1 "Red Hat Display",sans-serif;white-space:nowrap}
.kpi span{font-size:13px;color:#cfe3df}.kpi.hot b{color:#fff3cd}
.bars{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:24px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:13px;color:#cfe3df}
.bar i{display:block;width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:#5fb9a7;min-height:3px;transition:height .4s}
.bar.now i{background:#fff}.bar em{font-style:normal;color:#fff;font-weight:700}
.barcap{font-size:13px;color:#cfe3df;margin-top:6px}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 max(5vw,16px);background:var(--band);border-top:1px solid rgba(255,255,255,.1)}
nav a{flex:none;color:#cfe3df;text-decoration:none;padding:14px 14px 12px;border-bottom:3px solid transparent;font-weight:500}
nav a.on{color:#fff;border-color:#fff}
main{padding:28px max(5vw,16px) 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.5vw,26px);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 14px;margin-bottom:16px}
.wide{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute);font-weight:500}
input,select,textarea{font:16px "Red Hat Text",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:88px;resize:vertical}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;height:44px;line-height:1.2;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0}
select{-webkit-appearance:none;appearance:none;height:44px;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{font:700 15px "Red Hat Text",sans-serif;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.armed{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--mute);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:500;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.r{text-align:right;white-space:nowrap}.nw{white-space:nowrap}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.tag.open{background:#fff3cd;color:#5c4500}.tag.ok{color:var(--ok)}
.grp{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.grp:first-of-type{border:0;margin-top:0;padding-top:0}
#clients{margin-bottom:20px}#clients .grid{margin-bottom:0}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--acc)}
.empty{padding:22px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
details summary{cursor:pointer;font-weight:700;padding:8px 0}
.warn{background:light-dark(#fff3cd,#3a3010);border:1px solid #e6c65c;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
#modal{position:fixed;inset:0;background:rgba(8,30,26,.6);display:none;overflow-y:auto;padding:20px 12px;z-index:9}
#modal.show{display:block}
.mbar{max-width:800px;margin:0 auto 12px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
pre,.scroll{overflow-x:auto}
.paper{max-width:800px;margin:0 auto;background:#fff;color:#1c2430;border-radius:6px;font-size:14px;line-height:1.5;overflow:hidden}
.paper p{margin:0}.paper .pbar{height:8px;background:#1f8a78}.paper .pin{padding:clamp(18px,5vw,48px)}
.paper .ph{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.paper .pname{font:700 24px/1.1 "Red Hat Display",system-ui,sans-serif;color:#146155}.paper .psub{color:#5d6b78;font-size:13px;margin-top:5px}
.paper .padr{text-align:right;color:#5d6b78;font-size:12.5px;line-height:1.6}
.paper .pmid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:24px;margin-top:28px;align-items:start}
.paper .psend{display:inline-block;font-size:9.5px;color:#5d6b78;border-bottom:1px solid #d6dedc;padding-bottom:3px;margin-bottom:10px}
.paper .pinfo{background:#e8f1ef;border-radius:12px;padding:14px 18px;display:grid;gap:8px}
.paper .pinfo div{display:flex;justify-content:space-between;gap:12px;font-size:13px}.paper .pinfo span{color:#5d6b78}.paper .pinfo b{text-align:right}
.paper mark{background:#fff3cd;color:#5c4500;padding:0 5px;border-radius:3px}
.paper h1{font-size:30px;color:#146155;margin:26px 0 12px}
.paper table.pt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:14px}
.paper .pt th{background:#1f8a78;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:11px 8px;border:0}
.paper .pt td{padding:12px 8px;border-bottom:1px solid #d6dedc;vertical-align:top}.paper .pt .sub{display:block;font-size:11.5px;color:#5d6b78;margin-top:3px}
.paper .ptot{display:flex;justify-content:flex-end;margin-top:18px}
.paper .ptot div{background:#e8f1ef;border-left:4px solid #146155;padding:12px 18px;display:flex;gap:28px;align-items:baseline;border-radius:0 4px 4px 0}
.paper .ptot span{font-size:10.5px;letter-spacing:.1em;color:#5d6b78;text-transform:uppercase}.paper .ptot b{font:700 20px "Red Hat Display",system-ui,sans-serif;color:#146155}
.paper .ppay{border:1px solid #d6dedc;border-radius:12px;padding:16px 20px;margin-top:18px}
.paper .ppay h3{font:700 10.5px "Red Hat Text",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#146155}.paper .ppay p{margin:6px 0 12px;color:#5d6b78}
.paper .ppay dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 28px;margin:0}.paper .ppay dt{color:#5d6b78}.paper .ppay dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.paper .pfoot{display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;border-top:1px solid #d6dedc;margin-top:30px;padding-top:10px;font-size:11px;color:#5d6b78}
@media(max-width:600px){.paper .pmid{grid-template-columns:minmax(0,1fr)}.paper .padr{text-align:left}.paper table.pt{font-size:12px}.paper .pt th,.paper .pt td{padding:8px 5px}.paper .ppay dl{gap:6px 14px}}
#auth{position:fixed;inset:0;background:var(--band);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;overflow-y:auto}
#auth.show{display:flex}
#auth form{background:var(--panel);border-radius:16px;padding:26px;max-width:380px;width:100%;display:grid;gap:14px}
@media(max-width:760px){.head{grid-template-columns:minmax(0,1fr)}.bars{height:130px}}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:13px}.stack td:empty{display:none}.paper .stack td{padding-inline-start:6.5em}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="band"><div class="wrap">
  <div class="top"><div><h1>Dozenten-Cockpit</h1><p>NTG-Nachhilfe und Dozententätigkeit · Stunden, Rechnungen, Schüler, Akquise</p></div><div class="row"><span class="pill" id="status">Lädt…</span><button class="pill" id="logout" data-act="logout" hidden>Abmelden</button></div></div>
  <div class="head"><div class="kpis" id="kpis"></div><div><div class="bars" id="bars"></div><div class="barcap">Unterrichtsstunden pro Monat, letzte 6 Monate</div></div></div>
</div></header>
<nav id="nav"><a href="#stunden">Stunden</a><a href="#rechnungen">Rechnungen</a><a href="#schueler">Schüler</a><a href="#akquise">Akquise</a><a href="#einstellungen">Einstellungen</a></nav>
<main><div class="wrap" id="view"></div></main>
<div id="modal"></div>
<div id="auth"></div>
<div class="toast" id="toast"></div>
<!-- Leere Startdaten. Eigene Daten über Einstellungen → Importieren laden. Änderungen werden im Browser (localStorage) gespeichert; Sicherung über Einstellungen → Daten kopieren. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script id="state" type="application/json">{"v": 1, "ts": 0, "me": {"name": "", "street": "", "city": "", "email": "", "tel": "", "steuernr": "", "iban": "", "hinweis": "Umsatzsteuerbefreit gemäß § 4 Nr. 21 UStG.", "ziel": 14, "zweck": "NTG-Nachhilfe IHK", "nextNr": "2026-001"}, "clients": [], "entries": [], "invoices": [], "students": [], "leads": [], "last": {}}</script>
<script>
{
const $=s=>document.querySelector(s);
let S=JSON.parse(document.getElementById('state').textContent);
try{const l=JSON.parse(localStorage.getItem('dz-state')||'null');if(l&&l.v===1&&l.ts>S.ts)S=l}catch(e){}
let MODAL=null,canStore=true;
/* Download direkt im Browser (ersetzt die Artifact-Downloads-Funktion) */
const DL={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}};
const TABS=['stunden','rechnungen','schueler','akquise','einstellungen'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const STAT=['Geplant','Beworben','Gespräch','Zusage','Aktiv','Absage'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const de=iso=>iso?iso.split('-').reverse().join('.'):'';
const fx=n=>(Math.round(n*100)/100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=n=>fx(n)+' €';
const num=n=>(+n).toLocaleString('de-DE',{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const uid=()=>Math.random().toString(36).slice(2,9);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const client=id=>S.clients.find(c=>c.id===id)||{name:'(gelöschter Auftraggeber)',addr:'',rate:0};
const lineText=e=>[e.leistung,de(e.date),e.student?(e.g==='w'?'Schülerin: ':'Schüler: ')+e.student:''].filter(Boolean).join(', ');
const period=i=>i.period[0]===i.period[1]?de(i.period[0]):de(i.period[0])+' – '+de(i.period[1]);
const menge=u=>num(u)+' Unterrichtsstunde'+(+u===1?'':'n');
const zweck=i=>{const m=+i.period[1].slice(5,7)-1;return 'Rechnung '+i.nr+' – '+(i.from||S.me).zweck+', '+MON[m]+' '+i.period[1].slice(0,4)};
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),ms||2400)}
function status(t){$('#status').textContent=t}
function tab(){const h=location.hash.slice(1);if(TABS.includes(h))return h;try{const l=localStorage.getItem('dz-tab');if(TABS.includes(l))return l}catch(e){}return 'stunden'}

/* Speichern (lokal im Browser) */
function commit(msg){S.ts=Date.now();try{localStorage.setItem('dz-state',JSON.stringify(S));canStore=true}catch(e){canStore=false}render();if(msg)toast(msg);cloudSave()}

/* Cloud (Supabase): Login, ein JSON-Stand pro Nutzer, Row Level Security */
const SB_URL='https://wxyqhsrepfkdhcnllxjx.supabase.co',SB_KEY='sb_publishable_VOA3v19n1bWIJD_abNy2cw_SY5WV2_-';
let SB=null,USER=null,LOCAL_ONLY=false,CT=null;
try{SB=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
function cloudSave(){if(!SB||!USER){status(canStore?'Lokal gespeichert':'Speichern nicht möglich');return}
  status('Speichert…');clearTimeout(CT);CT=setTimeout(pushNow,800)}
async function pushNow(){CT=null;if(!SB||!USER)return;
  const{error}=await SB.from('cockpit_state').upsert({user_id:USER.id,data:S,updated_at:new Date().toISOString()});
  status(error?'Cloud-Fehler beim Speichern: '+error.message:'In der Cloud gespeichert')}
async function pull(){if(!SB||!USER)return;
  const{data,error}=await SB.from('cockpit_state').select('data').eq('user_id',USER.id).maybeSingle();
  if(error){status('Cloud-Fehler beim Laden: '+error.message);return}
  const r=data&&data.data;
  if(!r){await pushNow();return}
  if(r.v===1&&(r.ts||0)>(S.ts||0)){S=r;try{localStorage.setItem('dz-state',JSON.stringify(S))}catch(e){}render()}
  else if((S.ts||0)>(r.ts||0)){await pushNow();return}
  status('In der Cloud gespeichert')}
function showAuth(msg,mail){$('#auth').innerHTML=`<form id="f-auth"><h2>Dozenten-Cockpit</h2><p class="muted" style="margin:0">Melde dich an, damit deine Daten auf allen Geräten gleich sind.</p>${msg?`<div class="warn" style="margin:0">${esc(msg)}</div>`:''}
  <label>E-Mail<input type="email" name="email" autocomplete="username" value="${esc(mail||'')}" required></label>
  <label>Passwort<input type="password" name="pw" autocomplete="current-password" minlength="8" required></label>
  <button class="btn pri">Anmelden</button><button type="button" class="btn" data-act="signup">Neu registrieren</button>
  <button type="button" class="btn sm" data-act="localOnly">Ohne Anmeldung nur lokal nutzen</button></form>`;$('#auth').classList.add('show')}
function hideAuth(){$('#auth').classList.remove('show');$('#auth').innerHTML=''}
async function doLogin(d){status('Anmeldung…');const{error}=await SB.auth.signInWithPassword({email:d.email.trim(),password:d.pw});if(error)showAuth('Anmeldung fehlgeschlagen: '+error.message,d.email)}
async function doSignup(){const f=$('#f-auth');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));
  const{data,error}=await SB.auth.signUp({email:d.email.trim(),password:d.pw});
  if(error)showAuth('Registrierung fehlgeschlagen: '+error.message,d.email);
  else if(!data.session)showAuth('Bestätigungs-Mail gesendet. Bestätige die Adresse und melde dich danach an.',d.email)}

/* Kopf */
function renderHead(){
  const ym=today().slice(0,7),y=ym.slice(0,4);
  const open=S.entries.filter(e=>!e.inv),unpaid=S.invoices.filter(i=>!i.paid);
  const k=[[num(sum(S.entries.filter(e=>e.date.startsWith(ym)),e=>+e.ue)),'Unterrichtsstunden im '+MON[+ym.slice(5)-1],''],
    [eur(sum(S.invoices.filter(i=>i.date.startsWith(y)),i=>i.total)),'Abgerechnet '+y,''],
    [eur(sum(open,e=>e.ue*e.rate)),num(sum(open,e=>+e.ue))+' UStd. noch nicht abgerechnet',open.length?'hot':''],
    [eur(sum(unpaid,i=>i.total)),unpaid.length+' Rechnung'+(unpaid.length===1?'':'en')+' unbezahlt',unpaid.length?'hot':'']];
  $('#kpis').innerHTML=k.map(([b,s,c])=>`<div class="kpi ${c}"><b>${b}</b><span>${s}</span></div>`).join('');
  const d=new Date(),ms=[];for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(x.getFullYear()+'-'+pad(x.getMonth()+1))}
  const v=ms.map(m=>sum(S.entries.filter(e=>e.date.startsWith(m)),e=>+e.ue)),mx=Math.max(1,...v);
  $('#bars').innerHTML=ms.map((m,i)=>`<div class="bar ${i===5?'now':''}"><em>${v[i]?num(v[i]):''}</em><i style="height:${Math.round(v[i]/mx*100)}%"></i>${MON[+m.slice(5)-1].slice(0,3)}</div>`).join('');
  for(const a of document.querySelectorAll('#nav a'))a.classList.toggle('on',a.getAttribute('href')==='#'+tab());
}

/* Ansichten */
function vStunden(){
  const L=S.last||{},c0=client(L.client||S.clients[0]?.id);
  const opts=S.clients.map(c=>`<option value="${esc(c.id)}" ${c.id===L.client?'selected':''}>${esc(c.name)}</option>`).join('');
  const all=[...S.entries].sort((a,b)=>b.date.localeCompare(a.date));
  const months=[...new Set(all.map(e=>e.date.slice(0,7)))];
  return `<form id="f-entry" class="card"><h2>Stunden eintragen</h2><div class="grid">
   <label>Datum<input type="date" name="date" value="${today()}" required></label>
   <label>Auftraggeber<select name="client" required>${opts}</select></label>
   <label>Schüler/in<input name="student" list="dl-st" autocomplete="off" placeholder="Name"></label>
   <label>Anrede auf Rechnung<select name="g"><option value="m">Schüler</option><option value="w">Schülerin</option></select></label>
   <label class="wide">Leistung<input name="leistung" value="${esc(L.leistung||'Einzelunterricht NTG (IHK-Weiterbildung)')}" required></label>

  B();sz(7.5);col(C.mute);sp('RECHNUNGSBETRAG',116.3,y+8,.4);sz(14);col(C.dark);t(e(i.total),184.9,y+8.7,{align:'right'});
  y+=13.5+7.3;
  /* Steuerhinweis */
  B();sz(9.5);col(C.ink);t('Steuerhinweis:',L,y);const w1=d.getTextWidth('Steuerhinweis: ');N();const hl=d.splitTextToSize(me.hinweis||'',R-L-w1);hl.forEach((s,j)=>t(s,L+w1,y+j*4.6));y+=(hl.length-1)*4.6+6.9;
  /* Zahlungsbedingungen */
  N();sz(9.5);const para=d.splitTextToSize('Bitte überweisen Sie den Rechnungsbetrag innerhalb von '+me.ziel+' Tagen ohne Abzug auf folgendes Konto:',150);
  const iban=fmtIban(me.iban);
  B();sz(10);const rows=[['Kontoinhaber',[me.name]],['IBAN',[iban]],['Verwendungszweck',d.splitTextToSize(zweck(i),118)]];
  let yr=13.6+(para.length-1)*4.9+9.7;const pos=[];rows.forEach(r=>{pos.push(yr);yr+=(r[1].length-1)*4.4+7.2});const bh=yr-7.2+6.8;
  if(y+bh>272){d.addPage();topbar();y=20}
  stroke(C.line);d.setLineWidth(.3);d.roundedRect(L,y,R-L,bh,3,3,'S');
  B();sz(7.5);col(C.dark);sp('ZAHLUNGSBEDINGUNGEN',26.2,y+6.9,.4);
  N();sz(9.5);col(C.mute);para.forEach((s,j)=>t(s,26.2,y+13.6+j*4.9));
  rows.forEach((r,k)=>{N();sz(10);col(C.mute);t(r[0],26.7,y+pos[k]);B();col(C.ink);r[1].forEach((s,j)=>t(s,65.3,y+pos[k]+j*4.4))});
  y+=bh+8.7;
  /* Schluss */
  if(y+19>272){d.addPage();topbar();y=24}
  N();sz(10);col(C.ink);t('Vielen Dank für die gute Zusammenarbeit.',L,y);y+=9.1;t('Mit freundlichen Grüßen',L,y);y+=9.9;B();t(me.name,L,y);
  /* Fußzeile auf jeder Seite */
  const np=d.getNumberOfPages();
  for(let pg=1;pg<=np;pg++){d.setPage(pg);stroke(C.line);d.setLineWidth(.2);d.line(L,277.3,R,277.3);N();sz(7.5);col(C.mute);
    const a=me.name+' · '+me.street+' · '+me.city,b=me.email+' · '+me.tel,c='Rechnung '+i.nr+(np>1?' · Seite '+pg+'/'+np:'');
    t(a,L,283.2);t(c,R,283.2,{align:'right'});const free=(R-d.getTextWidth(c))-(L+d.getTextWidth(a));t(b,L+d.getTextWidth(a)+(free-d.getTextWidth(b))/2,283.2)}
  return d.output('blob');
}

/* Aktionen */
const act={
  bill:b=>bill(b.dataset.c,b.dataset.m),
  delEntry:b=>{S.entries=S.entries.filter(e=>e.id!==b.dataset.id);commit('Eintrag gelöscht')},
  view:b=>{MODAL=b.dataset.id;renderModal()},
  close:()=>closeModal(),
  paid:b=>{const i=S.invoices.find(x=>x.id===b.dataset.id);i.paid=!i.paid;i.paidDate=i.paid?today():'';commit(i.paid?'Als bezahlt markiert':'Wieder offen')},
  storno:b=>{const id=b.dataset.id;S.invoices=S.invoices.filter(i=>i.id!==id);S.entries.forEach(e=>{if(e.inv===id)e.inv=null});commit('Rechnung storniert, Stunden wieder offen')},
  pdf:async b=>{const i=S.invoices.find(x=>x.id===MODAL);b.disabled=true;b.textContent='Erstelle PDF…';
    try{const blob=await makePdf(i);await DL.save({filename:'Rechnung_'+i.nr+'.pdf',data:blob});toast('PDF gespeichert')}
    catch(e){toast('PDF-Bibliothek konnte nicht geladen werden')}
    if(b.isConnected){b.disabled=false;b.textContent='PDF herunterladen'}},
  delStudent:b=>{S.students=S.students.filter(s=>s.id!==b.dataset.id);commit('Entfernt')},
  delLead:b=>{S.leads=S.leads.filter(s=>s.id!==b.dataset.id);commit('Entfernt')},
  addClient:()=>{saveMe(false);S.clients.push({id:uid(),name:'Neuer Auftraggeber',addr:'',rate:25});render()},
  delClient:b=>{saveMe(false);S.clients=S.clients.filter(c=>c.id!==b.dataset.id);commit('Auftraggeber entfernt')},
  signup:()=>doSignup(),
  localOnly:()=>{LOCAL_ONLY=true;hideAuth();status('Lokal gespeichert')},
  logout:async()=>{try{await SB.auth.signOut({scope:'local'})}catch(e){}
    try{Object.keys(localStorage).filter(k=>k.startsWith('sb-')||k==='dz-state').forEach(k=>localStorage.removeItem(k))}catch(e){}
    location.reload()},
  copy:async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Daten kopiert')}catch(e){toast('Kopieren nicht möglich')}},
  import:()=>{try{const x=JSON.parse($('#imp').value);if(x.v!==1||!Array.isArray(x.entries))throw 0;S=x;commit('Daten importiert')}catch(e){toast('Text ist keine gültige Sicherung')}}
};
function saveMe(doCommit){
  const f=$('#f-me');if(!f)return;const d=new FormData(f);
  for(const k of ['name','untertitel','street','city','email','tel','steuernr','iban','hinweis','zweck','nextNr'])S.me[k]=String(d.get(k)||'').trim();
  S.me.ziel=+d.get('ziel')||14;
  for(const row of document.querySelectorAll('[data-cid]')){const c=S.clients.find(x=>x.id===row.dataset.cid);if(!c)continue;
    c.name=row.querySelector('[data-k=name]').value.trim();c.addr=row.querySelector('[data-k=addr]').value.trim();c.rate=+row.querySelector('[data-k=rate]').value||0}
  if(doCommit)commit('Einstellungen gespeichert');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
  if(b.hasAttribute('data-confirm')&&!b.classList.contains('armed')){b.classList.add('armed');b.dataset.lbl=b.textContent;b.textContent='Sicher?';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=b.dataset.lbl}},3000);return}
  act[b.dataset.act]&&act[b.dataset.act](b)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
  if(f.id==='f-entry'){const bm=S.entries.find(en=>en.inv&&en.client===d.client&&en.date.slice(0,7)===d.date.slice(0,7)),bi=bm&&S.invoices.find(x=>x.id===bm.inv);
    if(bm){toast('Für '+MON[+d.date.slice(5,7)-1]+' '+d.date.slice(0,4)+' gibt es schon die Rechnung '+(bi?bi.nr:'')+'. Storniere sie zuerst unter Rechnungen, dann kannst du Stunden nachtragen.',6000);return}
    S.entries.push({id:uid(),date:d.date,client:d.client,student:d.student.trim(),g:d.g,leistung:d.leistung.trim(),ue:+d.ue,rate:+d.rate,inv:null});
    if(d.student.trim()&&!S.students.some(s=>s.name===d.student.trim()))S.students.push({id:uid(),name:d.student.trim(),kurs:client(d.client).name,exam:'',focus:'',next:''});
    S.last={client:d.client,leistung:d.leistung.trim(),ue:+d.ue};commit('Eingetragen: '+num(d.ue)+' UStd.')}
  if(f.id==='f-student'){S.students.push({id:uid(),name:d.name.trim(),kurs:d.kurs.trim(),exam:d.exam,focus:d.focus.trim(),next:d.next});commit('Hinzugefügt')}
  if(f.id==='f-lead'){S.leads.push({id:uid(),org:d.org.trim(),contact:d.contact.trim(),status:d.status,date:d.date,next:d.next.trim()});commit('Hinzugefügt')}
  if(f.id==='f-me')saveMe(true);
  if(f.id==='f-auth')doLogin(d)});
document.addEventListener('change',e=>{const x=e.target;
  if(x.matches('#f-entry [name=client]'))$('#f-entry [name=rate]').value=client(x.value).rate;
  if(x.matches('#f-entry [name=student]')){const p=[...S.entries].reverse().find(en=>en.student===x.value.trim());if(p)$('#f-entry [name=g]').value=p.g}
  if(x.dataset.lead){const l=S.leads.find(v=>v.id===x.dataset.lead);l.status=x.value;if(!l.date)l.date=today();commit('Status: '+x.value)}});
window.addEventListener('hashchange',()=>{try{localStorage.setItem('dz-tab',tab())}catch(e){}render();window.scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL)closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&USER&&!CT)pull()});
render();
if(SB){status('Anmeldung prüfen…');SB.auth.onAuthStateChange((ev,sess)=>{USER=sess?sess.user:null;$('#logout').hidden=!USER;if(USER){hideAuth();setTimeout(pull,0);if(MODAL||tab()==='einstellungen')render()}else if(!LOCAL_ONLY)showAuth()})}
else status('Lokal gespeichert (Cloud nicht verfügbar)');
}
</script></body></html>
